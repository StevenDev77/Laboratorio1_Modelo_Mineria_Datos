version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build: ./user-service
    ports:
      - "3001:3001"
    environment:
      - JWT_SECRET=supersecret12345
      - DB_HOST=postgres-user

  product-service:
    build: ./product-service
    ports:
      - "3002:3002"
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  order-service:
    build: ./order-service
    ports:
      - "3003:3003"
    environment:
      - APP_ENV=production
